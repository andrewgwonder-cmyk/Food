<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Рацион">
<meta name="theme-color" content="#eef2f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Рацион</title>
<style>
/* Макет: одна колонка до 560px, липкая шапка дня, нижняя панель вкладок. Нейтрали с холодным морским оттенком, акцент — глубокий зелёный. */
:root{
  --bg:#eef2f3; --card:#ffffff; --ink:#13202a; --muted:#5f6e77; --line:#dbe3e6; --soft:#e4ecee;
  --accent:#1d6f5c; --accent-ink:#ffffff; --accent-soft:#d9ece5;
  --prot:#356cb0; --fat:#b97d1f; --carb:#7a5cb3; --fib:#5d7f2e;
  --warn:#b8601c; --bad:#b63a2b; --ok:#1d6f5c;
  --shadow:0 1px 2px rgba(19,32,42,.06),0 2px 10px rgba(19,32,42,.04);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1417; --card:#162126; --ink:#e7eef0; --muted:#93a3aa; --line:#24343b; --soft:#1c2a30;
  --accent:#5cc3a2; --accent-ink:#06231b; --accent-soft:#17342c;
  --prot:#79a8e6; --fat:#e2ab52; --carb:#b39ae6; --fib:#9cc566;
  --warn:#e59a55; --bad:#ef7b6c; --ok:#5cc3a2;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1417; --card:#162126; --ink:#e7eef0; --muted:#93a3aa; --line:#24343b; --soft:#1c2a30;
  --accent:#5cc3a2; --accent-ink:#06231b; --accent-soft:#17342c;
  --prot:#79a8e6; --fat:#e2ab52; --carb:#b39ae6; --fib:#9cc566;
  --warn:#e59a55; --bad:#ef7b6c; --ok:#5cc3a2;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* шапка */
.top{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px;display:flex;align-items:center;gap:6px}
.top h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.datebtn{flex:1;min-width:0;text-align:center;padding:6px 4px;border-radius:10px}
.datebtn b{display:block;font-size:17px;font-weight:650}
.datebtn small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.ibtn:active{background:var(--soft)}
.ibtn svg{width:22px;height:22px}
.pill{display:inline-block;font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:2px}
.pill.plan{background:transparent;border:1px dashed var(--accent)}

/* бюджет дня */
.budget{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:grid;gap:12px}
.bud-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.bud-big{font-family:var(--f-num);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bud-big.over{color:var(--bad)}
.bud-cap{font-size:13px;color:var(--muted);margin-top:4px}
.bud-side{text-align:right;font-size:13px;color:var(--muted);line-height:1.5}
.bud-side b{color:var(--ink);font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .eat{background:var(--accent)}
.bar .eat.over{background:var(--bad)}
.bar .bonus{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 4px,transparent 4px 8px)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mac{min-width:0}
.mac span{font-size:12px;color:var(--muted);display:block}
.mac b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
.mac em{font-style:normal;color:var(--muted);font-size:12px}
.mbar{height:4px;border-radius:9px;background:var(--soft);margin-top:4px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:9px}

/* блоки дня */
.sec{margin-top:14px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.sec-h{display:flex;align-items:center;gap:10px;padding:12px 8px 12px 16px}
.sec-h h3{margin:0;font-size:16px;font-weight:650;flex:1}
.sec-h .k{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.plus{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.plus svg{width:18px;height:18px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:active{background:var(--soft)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:500;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;color:var(--muted);font-size:13px}
.row .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;flex:none;text-align:right}
.row .v small{display:block;color:var(--muted);font-size:12px}
.empty{padding:2px 16px 14px;color:var(--muted);font-size:14px}
.weightline{display:flex;align-items:center;gap:12px;padding:14px 16px}
.weightline b{font-family:var(--f-num);font-size:18px;font-weight:600}

.banner{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);display:flex;gap:10px;align-items:center;font-size:14px}
.banner span{flex:1}
.banner.warn{background:color-mix(in srgb,var(--warn) 16%,var(--card))}

/* вкладки */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
#tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
.tab{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);font-weight:500}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* общие элементы */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:99px;background:var(--soft);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--soft);font-weight:600;font-size:16px;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad)}
.btn.wide{width:100%}
.btn:active{filter:brightness(.95)}
.btns{display:grid;gap:8px;margin-top:14px}
.btns.two{grid-template-columns:1fr 1fr}
.link{color:var(--accent);font-weight:600;font-size:15px}
.field{display:grid;gap:6px;margin-top:12px}
.field>label,.lab{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
.inp:focus{border-color:var(--accent);outline:none}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*,.grid3>*{min-width:0}
input[type=date].inp{min-width:0;width:100%;display:block}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.help{font-size:13px;color:var(--muted);line-height:1.45}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;min-width:0}
.tile span{font-size:12.5px;color:var(--muted);display:block}
.tile b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;display:block;margin-top:2px}
.tile small{font-size:12.5px;color:var(--muted)}
.good{color:var(--ok)!important}.badc{color:var(--bad)!important}
.list .row:first-child{border-top:0}
.menu .row{font-size:16px}
.menu .row svg{width:20px;height:20px;color:var(--muted)}
.prog{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-family:var(--f-ui);font-size:10px;fill:var(--muted)}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,var(--card));font-size:14px}

/* листы */
.layer{position:fixed;inset:0;z-index:40}
.ov{position:absolute;inset:0;background:rgba(5,12,16,.42);opacity:0;transition:opacity .2s}
.layer.on .ov{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 18px);background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.layer.on .sheet{transform:none}
.layer.full .sheet{height:calc(100% - env(safe-area-inset-top,0px) - 18px)}
@media (prefers-reduced-motion:reduce){.sheet,.ov{transition:none}}
.sh-h{display:flex;align-items:center;gap:8px;padding:12px 12px 8px 16px}
.sh-h h2{flex:1;margin:0;font-size:18px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.x{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px}
.search{position:sticky;top:0;background:var(--bg);padding-bottom:8px;z-index:1}
.tag{font-size:11px;font-weight:650;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:1px}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--card);border-radius:var(--r);padding:14px;margin-top:12px;box-shadow:var(--shadow);text-align:center}
.preview span{display:block;font-size:12px;color:var(--muted)}
.preview b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:20px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11.5px;color:var(--muted);padding:4px 0;text-transform:uppercase}
.cd{aspect-ratio:1/1.08;max-width:100%;border-radius:10px;display:grid;align-content:center;justify-items:center;gap:1px;font-size:15px;position:relative}
.cd small{font-size:10px;color:var(--muted);font-family:var(--f-num)}
.cd.v{background:var(--soft)}
.cd.ok small{color:var(--ok);font-weight:650}
.cd.over small{color:var(--bad);font-weight:650}
.cd.plan small{color:var(--accent)}
.cd.plan{outline:1px dashed var(--accent);outline-offset:-3px}
.cd.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.sel{background:var(--ink);color:var(--bg)}
.cd.sel small{color:var(--bg)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wdays .chip{padding:8px 0;text-align:center}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;z-index:90;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
video.scan{width:100%;border-radius:var(--r);background:#000;aspect-ratio:4/3;object-fit:cover}
textarea.inp{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.onb{padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
.onb h1{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);text-align:left;width:100%}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:15.5px}
.opt small{color:var(--muted);font-size:13px}
.opts{display:grid;gap:8px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs" hidden></nav>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="impfile" accept=".json,application/json,text/plain" hidden>
<script src="foods.js"></script>
<script>
'use strict';
/* ========== базовые помощники ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r0=n=>Math.round(n||0), r1=n=>Math.round((n||0)*10)/10;
const fmt=n=>r0(n).toLocaleString('ru-RU');
const f1=n=>r1(n).toLocaleString('ru-RU',{maximumFractionDigits:1});
const f2=n=>(+n).toLocaleString('ru-RU',{maximumFractionDigits:2});
const num=v=>{const x=parseFloat(String(v??'').replace(',','.').replace(/\s/g,''));return isFinite(x)?x:NaN};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const dDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONS=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WDF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WDS=['пн','вт','ср','чт','пт','сб','вс'];
const fDate=(s,year)=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]+((year||d.getFullYear()!==new Date().getFullYear())?' '+d.getFullYear():'')};
const fShort=s=>{const d=pd(s);return d.getDate()+' '+MONS[d.getMonth()]};
function relDay(s){const k=dDiff(today(),s);return k===0?'Сегодня':k===-1?'Вчера':k===1?'Завтра':WDF[pd(s).getDay()].replace(/^./,c=>c.toUpperCase())}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
const IC={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  diary:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h11a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6z"/><path d="M6 3.5v17M9.5 8h6M9.5 12h6"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>',
  goal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>',

const KCAL_PER_KG=7700;
const N0=()=>({k:0,p:0,f:0,c:0,fb:0});
function entN(e){const m=e.g/100;return{k:e.x.k*m,p:e.x.p*m,f:e.x.f*m,c:e.x.c*m,fb:(e.x.fb||0)*m}}
function addN(a,b){for(const k in a)a[k]+=b[k]||0;return a}
function getDay(s,create){if(!S.days[s]){if(!create)return null;S.days[s]={m:{b:[],l:[],d:[],s:[]},ex:[]}}return S.days[s]}
function dayTot(s){const t=N0(),d=S.days[s];if(!d)return t;for(const k in d.m)for(const e of d.m[k])addN(t,entN(e));return t}
function mealTot(arr){const t=N0();for(const e of arr)addN(t,entN(e));return t}
function dayEx(s){const d=S.days[s];return d?d.ex.reduce((a,e)=>a+(e.kcal||0),0):0}
function hasFood(s){const d=S.days[s];return !!d&&Object.values(d.m).some(a=>a.length)}
function dayEmpty(s){const d=S.days[s];return !d||(!hasFood(s)&&!d.ex.length)}
function wKeys(){return Object.keys(S.weights).sort()}
function weightOn(s){const ks=wKeys();let v=null;for(const k of ks){if(k<=s)v=S.weights[k];else break}if(v==null&&ks.length)v=S.weights[ks[0]];return v}
function ageOn(s){const b=pd(S.profile.birth),d=pd(s);let a=d.getFullYear()-b.getFullYear();if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))a--;return a}
function calc(s){
  s=s||today();const P=S.profile;if(!P)return null;
  const w=weightOn(s)||80,a=ageOn(s),G=S.goal;
  const bmr=10*w+6.25*P.h-5*a+(P.sex==='f'?-161:5);
  const tdee=bmr*P.act;
  const losing=G.target!=null&&w>G.target+0.05;
  const def=losing?G.rate*KCAL_PER_KG/7:0;
  const floor=P.sex==='f'?1200:1500;
  let kcal=tdee-def,clamped=false;if(kcal<floor){kcal=floor;clamped=true}
  const auto={k:kcal};
  if(G.ov.k)kcal=+G.ov.k;
  const refW=(G.target!=null&&G.target<w)?G.target:w;
  auto.p=refW*G.prot;auto.f=kcal*G.fatPct/100/9;
  const p=G.ov.p?+G.ov.p:auto.p, f=G.ov.f?+G.ov.f:auto.f;
  auto.c=Math.max(0,(kcal-p*4-f*9)/4);
  const c=G.ov.c?+G.ov.c:auto.c;
  return{w,a,bmr,tdee,def,kcal,clamped,floor,p,f,c,fb:14*kcal/1000,auto,losing};
}

const BASE=(window.BASE_FOODS||[]).map((a,i)=>({id:'b'+i,n:a[0],en:a[1],x:{k:a[2],p:a[3],f:a[4],c:a[5],fb:a[6]},srv:a[7]||[],src:'base',note:a[8]||''}));

function myFoods(){return S.foods.map(f=>Object.assign({src:'my'},f,{srcOrig:f.src}))}
function rcpAsFood(r){const t=rcpTotals(r);const wt=r.cooked||t.g||1;const per=wt/(r.servings||1);
  return{id:r.id,n:r.n,x:{k:t.n.k/wt*100,p:t.n.p/wt*100,f:t.n.f/wt*100,c:t.n.c/wt*100,fb:t.n.fb/wt*100},srv:[['1 порция',r1(per)]],src:'rcp'}}
function rcpTotals(r){const n=N0();let g=0;for(const i of r.items){addN(n,entN(i));g+=i.g}return{n,g}}
function findFood(src,id){if(src==='base')return BASE.find(f=>f.id===id);if(src==='rcp'){const r=S.recipes.find(x=>x.id===id);return r&&rcpAsFood(r)}return myFoods().find(f=>f.id===id)}
const normq=s=>String(s||'').toLowerCase().replace(/ё/g,'е').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function searchLocal(q,scope){
  const words=normq(q).split(/\s+/).filter(Boolean);
  let pool=[];
  if(scope==='all'||scope==='my')pool=pool.concat(myFoods());
  if(scope==='all'||scope==='rcp')pool=pool.concat(S.recipes.map(rcpAsFood));
  if(scope==='all')pool=pool.concat(BASE);
  if(!words.length)return pool.slice(0,200);
  const res=[];
  for(const f of pool){const n=normq(f.n+' '+(f.brand||''));if(words.every(w=>n.includes(w))){let sc=0;if(n.startsWith(words[0]))sc-=10;sc+=n.length/50;if(f.src!=='base')sc-=3;res.push([sc,f])}}
  return res.sort((a,b)=>a[0]-b[0]).map(a=>a[1]).slice(0,80);
}
function recentFoods(limit){
  const seen=new Set(),out=[];const ks=Object.keys(S.days).filter(k=>k<=addD(today(),1)).sort().reverse().slice(0,90);
  for(const k of ks){const d=S.days[k];for(const m of ['d','l','b','s'])for(const e of d.m[m].slice().reverse()){const key=e.src+'|'+(e.ref||e.n);if(seen.has(key))continue;seen.add(key);out.push(e);if(out.length>=limit)return out}}
  return out;
}

/* ---------- графики ---------- */
function niceMax(v,step){return Math.max(step,Math.ceil(v/step)*step)}
function kcalChart(rows){
  if(!rows.length)return '';

  const W=340,H=180,L=34,R=6,T=10,B=22,pw=W-L-R,ph=H-T-B,n=pts.length;
  const ymax=niceMax(Math.max(...pts.map(p=>Math.max(p.v||0,p.t)))*1.08,500);
  const y=v=>T+ph-(v/ymax)*ph,bw=pw/n;
  let g='';for(const tv of [0,ymax/2,ymax]){g+=`<line x1="${L}" x2="${W-R}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(--line)" stroke-width="1"/><text x="${L-5}" y="${y(tv)+3}" text-anchor="end">${fmt(tv)}</text>`}
  let bars='';pts.forEach((p,i)=>{if(p.v==null)return;const over=p.v>p.t*1.05;const x=L+i*bw+bw*0.15,hgt=Math.max(1,(p.v/ymax)*ph);bars+=`<rect x="${x.toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${Math.max(1,bw*0.7).toFixed(1)}" height="${hgt.toFixed(1)}" rx="${Math.min(3,bw*0.25).toFixed(1)}" fill="${over?'var(--bad)':'var(--accent)'}" opacity="${over?0.85:0.9}"/>`});
  let path='';pts.forEach((p,i)=>{const x1=L+i*bw,x2=x1+bw;path+=(i?'L':'M')+x1.toFixed(1)+' '+y(p.t).toFixed(1)+'L'+x2.toFixed(1)+' '+y(p.t).toFixed(1)});
  const lab=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${fShort(pts[i].d)}</text>`).join('');
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Калории по дням">${g}${bars}<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".7"/>${lab}</svg>

}
function weightChart(a,b,opts={}){
  const ks=wKeys().filter(k=>k>=a&&k<=b);if(!ks.length)return `<p class="help">Нет записей веса за этот период.</p>`;
  const span=Math.max(1,dDiff(a,b));const pts=ks.map(k=>({x:dDiff(a,k),w:S.weights[k]}));
  const vals=pts.map(p=>p.w);if(opts.goal!=null)vals.push(opts.goal);if(opts.proj)vals.push(opts.proj.w);
  let lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);if(hi-lo<4){hi+=1;lo-=1}
  const W=340,H=180,L=34,R=8,T=10,B=22,pw=W-L-R,ph=H-T-B;
  const X=x=>L+(x/span)*pw,Y=v=>T+ph-((v-lo)/(hi-lo))*ph;
  let g='';const st=Math.max(1,Math.round((hi-lo)/4));for(let v=lo;v<=hi;v+=st){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`}
  let goal='';if(opts.goal!=null)goal=`<line x1="${L}" x2="${W-R}" y1="${Y(opts.goal).toFixed(1)}" y2="${Y(opts.goal).toFixed(1)}" stroke="var(--accent)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${(Y(opts.goal)-4).toFixed(1)}" text-anchor="end" style="fill:var(--accent)">цель ${f1(opts.goal)}</text>`;
  // скользящее среднее за 7 дней
  const avg=pts.map(p=>{const win=pts.filter(q=>q.x<=p.x&&q.x>p.x-7);return{x:p.x,w:win.reduce((s,q)=>s+q.w,0)/win.length}});
  const line=avg.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.w).toFixed(1)).join('');
  const dots=pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="${pts.length>60?1.6:2.6}" fill="var(--muted)" opacity=".75"/>`).join('');
  let proj='';if(opts.proj){const last=pts[pts.length-1];proj=`<path d="M${X(last.x).toFixed(1)} ${Y(last.w).toFixed(1)}L${X(opts.proj.x).toFixed(1)} ${Y(opts.proj.w).toFixed(1)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round" fill="none"/>`}
  const lab=`<text x="${L}" y="${H-6}">${fShort(a)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fShort(b)}</text>`;
  const end=avg[avg.length-1];
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Вес">${g}${goal}${dots}<path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>${proj}<circle cx="${X(end.x).toFixed(1)}" cy="${Y(end.w).toFixed(1)}" r="4" fill="var(--ink)"/>${lab}</svg>
  <div class="legend"><span><i style="background:var(--muted);border-radius:50%"></i>замеры</span><span><i style="background:var(--ink);height:2px;border-radius:0"></i>среднее за 7 дней</span>${opts.proj?'<span><i style="background:none;border-top:2px dotted var(--accent);height:0;border-radius:0"></i>прогноз</span>':''}</div>`;
}
function trend(daysBack){const t=today(),a=addD(t,-daysBack);const ks=wKeys().filter(k=>k>=a&&k<=t);if(ks.length<2||dDiff(ks[0],ks[ks.length-1])<6)return null;
  const xs=ks.map(k=>dDiff(a,k)),ys=ks.map(k=>S.weights[k]),n=xs.length,mx=xs.reduce((s,v)=>s+v,0)/n,my=ys.reduce((s,v)=>s+v,0)/n;let num_=0,den=0;for(let i=0;i<n;i++){num_+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2}return den?num_/den*7:null}

/* ---------- статистика ---------- */
function periodRange(p){const t=today();if(p==='v'&&S.voyage)return[S.voyage.a,S.voyage.b<t?S.voyage.b:t];
  if(p==='all'){const ks=Object.keys(S.days).filter(hasFood).concat(wKeys()).filter(k=>k<=t).sort();return[ks[0]||t,t]}
  return[addD(t,-(+p-1)),t]}
function viewStats(){
  const P=[['7','7 дней'],['30','30 дней'],['90','3 мес'],['365','Год'],['all','Всё']];if(S.voyage)P.splice(4,0,['v','Рейс']);
  const [a,b]=periodRange(V.statP);
  let h=`<header class="top"><h1>Статистика</h1></header><div class="chips scroll">${P.map(([k,l])=>`<button class="chip${V.statP===k?' on':''}" data-a="statP" data-v="${k}">${l}</button>`).join('')}</div>
  <p class="sub" style="margin:10px 2px 0">${fDate(a,true)} — ${fDate(b,true)}</p>`;
  if(a>b)return h+`<div class="card"><p class="help">Рейс ещё не начался.</p></div>`;
  const rows=[];let logged=0,sumK=0,sumN=0,sumBal=0,sumEx=0,exMin=0;const mac=N0();const top={};
  for(let s=a;s<=b;s=addD(s,1)){const cc=calc(s),norm=dayNorm(s,cc);const hf=hasFood(s);const tk=hf?dayTot(s):null;const ex=dayEx(s);
    rows.push({d:s,v:hf?tk.k:null,t:norm});
    if(hf){logged++;sumK+=tk.k;sumN+=norm;addN(mac,tk);sumBal+=tk.k-(cc.tdee+ex);sumEx+=ex;const d=S.days[s];exMin+=d.ex.reduce((x,e)=>x+(e.min||0),0);
      for(const m in d.m)for(const e of d.m[m]){const key=e.n;top[key]=(top[key]||0)+entN(e).k}}}
  const total=rows.length;
  if(!logged)return h+`<div class="card"><p class="help" style="margin:0">За этот период нет записей питания. Статистика появится, когда вы заполните хотя бы один день.</p></div>`+(wKeys().length?`<div class="card"><h3>Вес</h3>${weightChart(a,b,{goal:S.goal.target})}</div>`:'');
  const avgK=sumK/logged,avgN=sumN/logged,estLoss=-sumBal/KCAL_PER_KG;
  const wk=wKeys().filter(k=>k>=a&&k<=b);const wch=wk.length>=2?S.weights[wk[wk.length-1]]-S.weights[wk[0]]:null;
  h+=`<div class="tiles">
   <div class="tile"><span>Среднее в день</span><b class="${avgK>avgN*1.05?'badc':''}">${fmt(avgK)}</b><small>при норме ${fmt(avgN)} ккал</small></div>
   <div class="tile"><span>Дней заполнено</span><b>${logged}</b><small>из ${total}</small></div>
   <div class="tile"><span>Дефицит за период</span><b class="${sumBal<0?'good':'badc'}">${sumBal<0?'−':'+'}${fmt(Math.abs(sumBal))}</b><small>≈ ${estLoss>=0?'−':'+'}${f1(Math.abs(estLoss))} кг жира</small></div>
   <div class="tile"><span>Вес за период</span><b class="${wch==null?'':wch<=0?'good':'badc'}">${wch==null?'—':(wch>0?'+':wch<0?'−':'')+f1(Math.abs(wch))}</b><small>${wch==null?'нужно 2+ замера':'кг по весам'}</small></div>
  </div>`;
  h+=`<div class="card"><h3>Калории по дням</h3>${kcalChart(rows)}</div>`;
  h+=`<div class="card"><h3>Вес</h3>${weightChart(a,b,{goal:S.goal.target})}</div>`;
  const pk=mac.p*4,fk=mac.f*9,ck=mac.c*4,sk=Math.max(1,pk+fk+ck),cc=calc(b);
  const mrow=(l,g,tg,k,col)=>`<div class="kv"><span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${col};margin-right:7px"></i>${l}</span><b>${fmt(g/logged)} г <span class="sub">/ ${fmt(tg)} г · ${r0(k/sk*100)}%</span></b></div>`;
  h+=`<div class="card"><h3>Среднее БЖУ в день</h3>
   <div class="bar" style="height:12px;margin-bottom:8px"><i style="width:${pk/sk*100}%;background:var(--prot)"></i><i style="width:${fk/sk*100}%;background:var(--fat)"></i><i style="width:${ck/sk*100}%;background:var(--carb)"></i></div>
   ${mrow('Белки',mac.p,cc.p,pk,'var(--prot)')}${mrow('Жиры',mac.f,cc.f,fk,'var(--fat)')}${mrow('Углеводы',mac.c,cc.c,ck,'var(--carb)')}
   <div class="kv"><span>Клетчатка</span><b>${fmt(mac.fb/logged)} г <span class="sub">/ ${fmt(cc.fb)} г</span></b></div></div>`;
  h+=`<div class="card"><h3>Активность</h3><div class="kv"><span>Сожжено всего</span><b>${fmt(sumEx)} ккал</b></div><div class="kv"><span>Время тренировок</span><b>${Math.floor(exMin/60)} ч ${exMin%60} мин</b></div><div class="kv"><span>В среднем за заполненный день</span><b>${fmt(sumEx/logged)} ккал</b></div></div>`;
  const tops=Object.entries(top).sort((x,y)=>y[1]-x[1]).slice(0,8);
  h+=`<div class="card"><h3>Больше всего калорий дали</h3>${tops.map(([n,k])=>`<div class="kv"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><b style="white-space:nowrap;flex:none">${fmt(k)} <span class="sub">${r0(k/sumK*100)}%</span></b></div>`).join('')}</div>`;
  h+=`<p class="help" style="margin:14px 2px 0">Дефицит считается от расхода (обмен × активность + тренировки) за заполненные дни. 1 кг жира ≈ ${fmt(KCAL_PER_KG)} ккал — это приближение, реальный вес ещё колеблется из-за воды и соли.</p>`;
  return h;
}

      let planned=0;for(let d=V_.a;d<=V_.b;d=addD(d,1))if(hasFood(d))planned++;s+=`<div class="kv"><span>Дней с записями питания</span><b>${planned} из ${len}</b></div>`;

const SH={};
function openSheet(type,st={},full){const o={type,st};V.sheets.push(o);const el=document.createElement('div');el.className='layer'+(full||SH[type].full?' full':'');o.el=el;sheetsEl.appendChild(el);drawSheet(o);requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));SH[type].init&&SH[type].init(o);return o}
function drawSheet(o){const d=SH[o.type];const ttl=typeof d.title==='function'?d.title(o.st):d.title;
  o.el.innerHTML=`<div class="ov" data-a="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(ttl)}"><header class="sh-h"><h2>${esc(ttl)}</h2><button class="x" data-a="close" aria-label="Закрыть">${IC.x}</button></header><div class="sh-b">${d.body(o.st,o)}</div>${d.foot?`<footer class="sh-f">${d.foot(o.st,o)}</footer>`:''}</section>`;
  d.after&&d.after(o)}
const topS=()=>V.sheets[V.sheets.length-1];
function closeSheet(n=1){while(n-->0&&V.sheets.length){const o=V.sheets.pop();o.st.onClose&&o.st.onClose();const el=o.el;el.classList.remove('on');setTimeout(()=>el.remove(),220)}}
function closeAll(){closeSheet(V.sheets.length)}
function refresh(o){o=o||topS();o&&drawSheet(o)}
const q=(o,sel)=>o.el.querySelector(sel);

/* --- добавление продукта --- */
SH.add={full:1,title:st=>st.mode==='ing'?'Ингредиент':'Добавить: '+MEALS.find(m=>m[0]===st.meal)[1].toLowerCase(),
  body:st=>{const tabs=st.mode==='ing'?[['all','Все'],['recent','Недавние'],['my','Мои'],['online','Онлайн']]:[['all','Все'],['recent','Недавние'],['my','Мои'],['rcp','Рецепты'],['online','Онлайн']];
    return `<div class="search"><input class="inp" id="aq" type="search" placeholder="${st.tab==='online'?'Название (USDA — на английском)':'Поиск продукта или блюда'}" value="${esc(st.q||'')}" autocomplete="off" enterkeyhint="search">
    <div class="chips scroll" style="margin-top:8px">${tabs.map(([k,l])=>`<button class="chip${st.tab===k?' on':''}" data-a="aTab" data-v="${k}">${l}</button>`).join('')}</div></div>
    <div id="ares"></div>`},
  foot:st=>`<div class="btns ${st.mode==='ing'?'':'two'}" style="margin:0">${st.mode==='ing'?'':'<button class="btn" data-a="quickOpen">Быстрая запись</button>'}<button class="btn" data-a="foodNew">+ Свой продукт</button></div>`,
  after:o=>{drawResults(o)}};
function foodRow(f,i){const sv=f.srv&&f.srv[0];return `<button class="row" data-a="aPick" data-v="${i}"><div class="t"><b>${esc(f.n)}${f.src!=='base'?`<span class="tag">${SRC[f.src]||''}</span>`:''}</b><small>${f.brand?esc(f.brand)+' · ':''}${fmt(f.x.k)} ккал · Б ${f1(f.x.p)} Ж ${f1(f.x.f)} У ${f1(f.x.c)} на 100 г${sv?' · '+esc(sv[0])+' '+fmt(sv[1])+' г':''}</small></div></button>`}
function drawResults(o){const st=o.st,box=q(o,'#ares');if(!box)return;let list=[],h='';
  if(st.tab==='online'){h=`<div class="btns two" style="margin-top:4px"><button class="btn" data-a="oUsda">Искать в USDA</button><button class="btn" data-a="oOff">Open Food Facts</button></div>
     <div class="grid2" style="grid-template-columns:1fr auto;margin-top:8px"><input class="inp num" id="bc" inputmode="numeric" placeholder="Штрихкод с упаковки" value="${esc(st.bc||'')}"><button class="btn" data-a="oCode">Найти</button></div>
     <button class="btn wide" style="margin-top:8px" data-a="scanOpen">${IC.scan.replace('<svg','<svg width="20" height="20"')} Сканировать камерой</button>`;
    if(st.status)h+=`<p class="help" style="margin-top:12px">${st.status}</p>`;list=st.online||[];
    if(!list.length&&!st.status)h+=`<p class="help" style="margin-top:12px">Нужен интернет. Найденный продукт сохранится в «Мои продукты» и дальше будет доступен офлайн. USDA ищет по-английски: chicken breast, buckwheat, cottage cheese. Open Food Facts — магазинные товары, можно по-русски или по-румынски.</p>`;}
  else if(st.tab==='recent'){list=recentFoods(40).map(entryAsFood);if(st.q)list=list.filter(f=>normq(f.n).includes(normq(st.q)));if(!list.length)h=`<p class="help" style="margin-top:12px">Здесь появятся продукты, которые вы уже записывали.</p>`}
  else{list=searchLocal(st.q,st.tab);if(st.mode==='ing')list=list.filter(f=>f.src!=='rcp');
    if(!list.length)h=`<p class="help" style="margin-top:12px">${st.tab==='rcp'?'Рецептов пока нет. Создайте их в разделе «Ещё → Рецепты и блюда».':st.tab==='my'&&!st.q?'Своих продуктов пока нет. Нажмите «+ Свой продукт» и перепишите состав с упаковки.':'Ничего не нашлось. Попробуйте вкладку «Онлайн» или создайте свой продукт.'}</p>`;
    if(!st.q&&st.tab==='all'){const rec=recentFoods(8).map(entryAsFood);if(rec.length){st.list=rec.concat(list);box.innerHTML=`<div class="lab" style="margin:6px 2px">Недавние</div><div class="sec list" style="margin-top:0">${rec.map((f,i)=>foodRow(f,i)).join('')}</div><div class="lab" style="margin:14px 2px 6px">Все продукты</div><div class="sec list" style="margin-top:0">${list.map((f,i)=>foodRow(f,i+rec.length)).join('')}</div>`;return}}}
  st.list=list;
  box.innerHTML=h+(list.length?`<div class="sec list">${list.map((f,i)=>foodRow(f,i)).join('')}</div>`:'');}

/* --- количество --- */
SH.amount={title:st=>st.editId?'Изменить запись':'Сколько',
  body:st=>{const f=st.food;const units=[['г',1]].concat(f.srv||[]);
    return `<div style="font-weight:650;font-size:17px">${esc(f.n)}${f.src!=='base'?`<span class="tag">${SRC[f.src]||''}</span>`:''}</div>
    <div class="sub">${f.brand?esc(f.brand)+' · ':''}на 100 г: ${fmt(f.x.k)} ккал · Б ${f1(f.x.p)} · Ж ${f1(f.x.f)} · У ${f1(f.x.c)}${f.x.fb?' · Кл '+f1(f.x.fb):''}</div>
    <div class="field"><label for="am">Количество${st.ui>0?', '+esc(units[st.ui][0]):', граммы'}</label><input class="inp num" id="am" inputmode="decimal" value="${esc(st.amt)}" style="font-size:22px;min-height:54px"></div>
    ${units.length>1?`<div class="chips" style="margin-top:8px">${units.map((u,i)=>`<button class="chip${st.ui===i?' on':''}" data-a="amUnit" data-v="${i}">${i?esc(u[0])+' · '+fmt(u[1])+' г':'граммы'}</button>`).join('')}</div>`:''}
    ${st.mode==='ing'?'':`<div class="lab" style="margin-top:14px">Приём пищи</div><div class="seg" style="margin-top:6px">${MEALS.map(([k,l])=>`<button data-a="amMeal" data-v="${k}" class="${st.meal===k?'on':''}">${l}</button>`).join('')}</div>`}
    <div class="preview" id="amp"></div>
    ${f.note?`<p class="help" style="margin-top:12px">Источник: ${esc(f.note)}.</p>`:''}${f.src==='base'&&f.en?`<p class="help" style="margin-top:12px">Значения ориентировочные. <button class="link" data-a="checkUsda">Сверить с USDA</button> — нужен интернет.</p>`:''}`},
  foot:st=>`<div class="btns ${st.editId?'two':''}" style="margin:0">${st.editId?'<button class="btn bad" data-a="amDel">Удалить</button>':''}<button class="btn pri" data-a="amOk">${st.editId?'Сохранить':'Добавить'}</button></div>`,
  after:o=>{const i=q(o,'#am');i.addEventListener('input',()=>{o.st.amt=i.value;amPrev(o)});amPrev(o);if(!o.st.editId)setTimeout(()=>{try{i.focus();i.select()}catch(e){}},280)}};
function amGrams(st){const units=[['г',1]].concat(st.food.srv||[]);const a=num(st.amt);if(!(a>0))return 0;return st.ui>0?a*units[st.ui][1]:a}
function amPrev(o){const g=amGrams(o.st),x=o.st.food.x,m=g/100;q(o,'#amp').innerHTML=`<div><span>ккал</span><b>${fmt(x.k*m)}</b></div><div><span>белки</span><b style="color:var(--prot)">${f1(x.p*m)}</b></div><div><span>жиры</span><b style="color:var(--fat)">${f1(x.f*m)}</b></div><div><span>углев.</span><b style="color:var(--carb)">${f1(x.c*m)}</b></div>`}
function openAmount(food,st){st=Object.assign({food,amt:'100',ui:0},st);if(!st.editId&&food.srv&&food.srv.length&&(food.src==='rcp'||food.src==='my'||food.src==='off'||food.note||food.srv[0][0].startsWith('1 шт'))){st.ui=1;st.amt='1'}openSheet('amount',st)}

/* --- быстрая запись --- */
SH.quick={title:'Быстрая запись',body:st=>`<p class="help" style="margin-top:0">Для блюд вне дома, когда точный состав неизвестен.</p>
  <div class="field"><label for="qn">Название</label><input class="inp" id="qn" value="${esc(st.n||'')}" placeholder="Шаурма большая"></div>
  <div class="field"><label for="qk">Калории</label><input class="inp num" id="qk" inputmode="decimal" value="${esc(st.k||'')}"></div>
  <div class="grid3"><div class="field"><label for="qp">Белки, г</label><input class="inp num" id="qp" inputmode="decimal" value="${esc(st.p||'')}"></div><div class="field"><label for="qf">Жиры, г</label><input class="inp num" id="qf" inputmode="decimal" value="${esc(st.f||'')}"></div><div class="field"><label for="qc">Углев., г</label><input class="inp num" id="qc" inputmode="decimal" value="${esc(st.c||'')}"></div></div>`,
  foot:st=>`<div class="btns ${st.editId?'two':''}" style="margin:0">${st.editId?'<button class="btn bad" data-a="qDel">Удалить</button>':''}<button class="btn pri" data-a="qOk">${st.editId?'Сохранить':'Добавить'}</button></div>`};

/* --- свой продукт --- */
SH.food={title:st=>st.id?'Продукт':'Новый продукт',full:1,
  body:st=>{const f=st.f;return `<div class="field" style="margin-top:0"><label for="fn">Название</label><input class="inp" id="fn" value="${esc(f.n||'')}"></div>
  <div class="field"><label for="fbr">Марка (необязательно)</label><input class="inp" id="fbr" value="${esc(f.brand||'')}"></div>
  <div class="lab" style="margin-top:12px">Значения с упаковки указаны</div><div class="seg" style="margin-top:6px"><button data-a="fBasis" data-v="100" class="${st.basis==='100'?'on':''}">на 100 г</button><button data-a="fBasis" data-v="srv" class="${st.basis==='srv'?'on':''}">на порцию</button></div>
  <div class="grid2"><div class="field"><label for="fsl">Порция: название</label><input class="inp" id="fsl" value="${esc(st.sl||'1 порция')}"></div><div class="field"><label for="fsg">Порция, г</label><input class="inp num" id="fsg" inputmode="decimal" value="${esc(st.sg||'')}"></div></div>
  <div class="grid2"><div class="field"><label for="fk">Калории</label><input class="inp num" id="fk" inputmode="decimal" value="${esc(st.v.k)}"></div><div class="field"><label for="fp">Белки, г</label><input class="inp num" id="fp" inputmode="decimal" value="${esc(st.v.p)}"></div>
  <div class="field"><label for="ff">Жиры, г</label><input class="inp num" id="ff" inputmode="decimal" value="${esc(st.v.f)}"></div><div class="field"><label for="fc">Углеводы, г</label><input class="inp num" id="fc" inputmode="decimal" value="${esc(st.v.c)}"></div>
  <div class="field"><label for="ffb">Клетчатка, г</label><input class="inp num" id="ffb" inputmode="decimal" value="${esc(st.v.fb)}"></div><div class="field"><label for="fbc">Штрихкод</label><input class="inp num" id="fbc" inputmode="numeric" value="${esc(f.code||'')}"></div></div>
  <p class="help">Если калории на упаковке только в кДж, разделите на 4,184.</p>`},
  foot:st=>`<div class="btns ${st.id?'two':''}" style="margin:0">${st.id?'<button class="btn bad" data-a="fDel">Удалить</button>':''}<button class="btn pri" data-a="fSave">Сохранить</button></div>`};
function openFood(f,after){f=f||{};const s=f.srv&&f.srv[0];const st={id:f.id,f:clone(f),basis:'100',sl:s?s[0]:'1 порция',sg:s?String(s[1]):'',v:f.x?{k:r1(f.x.k),p:r1(f.x.p),f:r1(f.x.f),c:r1(f.x.c),fb:r1(f.x.fb||0)}:{k:'',p:'',f:'',c:'',fb:''},after};openSheet('food',st)}
function foodRead(o){const st=o.st;st.f.n=q(o,'#fn').value.trim();st.f.brand=q(o,'#fbr').value.trim();st.sl=q(o,'#fsl').value.trim();st.sg=q(o,'#fsg').value;st.f.code=q(o,'#fbc').value.trim();
  st.v={k:q(o,'#fk').value,p:q(o,'#fp').value,f:q(o,'#ff').value,c:q(o,'#fc').value,fb:q(o,'#ffb').value}}

/* --- рецепт --- */
SH.rcp={full:1,title:st=>st.r.n||'Новый рецепт',
  body:st=>{const r=st.r,t=rcpTotals(r),wt=r.cooked||t.g,per=wt/(r.servings||1);
  return `<div class="field" style="margin-top:0"><label for="rn">Название</label><input class="inp" id="rn" value="${esc(r.n||'')}" placeholder="Гречка с курицей"></div>
  <div class="grid2"><div class="field"><label for="rs">Порций</label><input class="inp num" id="rs" inputmode="decimal" value="${r.servings||1}"></div><div class="field"><label for="rw">Вес готового, г</label><input class="inp num" id="rw" inputmode="decimal" value="${r.cooked||''}" placeholder="${fmt(t.g)}"></div></div>
  <p class="help">Взвесьте готовое блюдо целиком: при варке и жарке вес меняется, и расчёт на 100 г станет точнее. Если не указать, берётся сумма сырых ингредиентов.</p>
  <div class="lab" style="margin-top:12px">Ингредиенты</div>
  <div class="sec list" style="margin-top:6px">${r.items.length?r.items.map((e,i)=>`<button class="row" data-a="rItem" data-v="${i}"><div class="t"><b>${esc(e.n)}</b><small>${f1(e.g)} г</small></div><div class="v">${fmt(entN(e).k)}<small>ккал</small></div></button>`).join(''):'<div class="empty" style="padding-top:14px">Добавьте продукты, из которых готовите</div>'}
  <button class="row" data-a="rAdd" style="color:var(--accent);font-weight:600">${IC.plus.replace('<svg','<svg width="18" height="18"')} Добавить ингредиент</button></div>
  ${r.items.length?`<div class="card"><div class="kv"><span>Всего</span><b>${fmt(t.n.k)} ккал · ${fmt(wt)} г</b></div><div class="kv"><span>Порция (${fmt(per)} г)</span><b>${fmt(t.n.k/(r.servings||1))} ккал</b></div><div class="kv"><span>На 100 г</span><b>${fmt(t.n.k/wt*100)} ккал · Б ${f1(t.n.p/wt*100)} Ж ${f1(t.n.f/wt*100)} У ${f1(t.n.c/wt*100)}</b></div></div>`:''}`},
  foot:st=>`<div class="btns ${st.id?'two':''}" style="margin:0">${st.id?'<button class="btn bad" data-a="rDel">Удалить</button>':''}<button class="btn pri" data-a="rSave">Сохранить</button></div>`};
function rcpRead(o){const r=o.st.r;r.n=q(o,'#rn').value.trim();const s=num(q(o,'#rs').value);r.servings=s>0?s:1;const w=num(q(o,'#rw').value);r.cooked=w>0?w:null}

/* --- активность --- */
SH.ex={title:st=>st.editId?'Изменить активность':'Активность',
  body:st=>{const t=EXT.find(x=>x.id===st.t);return `<div class="field" style="margin-top:0"><label for="et">Вид</label><select class="inp" id="et">${EXT.map(x=>`<option value="${x.id}"${x.id===st.t?' selected':''}>${esc(x.n)}</option>`).join('')}</select></div>
   ${t.d?`<p class="help" style="margin:6px 2px 0">${esc(t.d)}${t.met?' · MET '+f1(t.met):''}</p>`:''}
   ${t.kind==='manual'?`<div class="field"><label for="en">Название</label><input class="inp" id="en" value="${esc(st.n||'')}" placeholder="Футбол, плавание…"></div><div class="grid2"><div class="field"><label for="ek">Сожжено, ккал</label><input class="inp num" id="ek" inputmode="decimal" value="${esc(st.k||'')}"></div><div class="field"><label for="em">Минут</label><input class="inp num" id="em" inputmode="decimal" value="${esc(st.min||'')}"></div></div><p class="help">Цифры с тренажёра или часов обычно включают покой и бывают завышены.</p>`
   :`<div class="grid2"><div class="field"><label for="em">Минут</label><input class="inp num" id="em" inputmode="decimal" value="${esc(st.min||'')}" placeholder="45"></div>${t.kind==='walk'?`<div class="field"><label for="ekm">Километров</label><input class="inp num" id="ekm" inputmode="decimal" value="${esc(st.km||'')}" placeholder="необязательно"></div>`:'<span></span>'}</div>
     ${t.kind==='walk'?`<div class="lab" style="margin-top:12px">Темп, если расстояние неизвестно</div><div class="chips" style="margin-top:6px">${PACE.map(([k,l,v])=>`<button class="chip${st.pace===k?' on':''}" data-a="exPace" data-v="${k}">${l} · ${String(v).replace('.',',')} км/ч</button>`).join('')}</div><p class="help">Расстояние и время можно посмотреть в приложении «Здоровье» или на часах.</p>`:''}`}
   <div class="preview" style="grid-template-columns:1fr 1fr" id="exp"></div>`},
  foot:st=>`<div class="btns ${st.editId?'two':''}" style="margin:0">${st.editId?'<button class="btn bad" data-a="exDel">Удалить</button>':''}<button class="btn pri" data-a="exOk">${st.editId?'Сохранить':'Добавить'}</button></div>`,
  after:o=>{q(o,'#et').addEventListener('change',e=>{exRead(o);o.st.t=e.target.value;refresh(o)});o.el.querySelectorAll('#em,#ekm,#ek').forEach(i=>i.addEventListener('input',()=>{exRead(o);exPrev(o)}));exPrev(o)}};
function exRead(o){const st=o.st;const g=s=>{const e=q(o,s);return e?e.value:undefined};st.min=g('#em')??st.min;st.km=g('#ekm')??st.km;st.k=g('#ek')??st.k;st.n=g('#en')??st.n}
function exCalc(st){const t=EXT.find(x=>x.id===st.t),kg=weightOn(st.date||V.date)||80,min=num(st.min);
  if(t.kind==='manual'){const k=num(st.k);return{kcal:k>0?k:0,met:null,min:min>0?min:null,n:(st.n||'').trim()||'Активность'}}
  if(!(min>0))return{kcal:0,met:t.met||null,min:null,n:t.n};
  let met=t.met,km=null;if(t.kind==='walk'){km=num(st.km);let kmh;if(km>0)kmh=km/(min/60);else{km=null;kmh=PACE.find(p=>p[0]===st.pace)[2]}met=walkMet(kmh);return{kcal:exKcal(met,kg,min),met,min,km,kmh,n:t.n}}
  return{kcal:exKcal(met,kg,min),met,min,n:t.n}}
function exPrev(o){const r=exCalc(o.st);q(o,'#exp').innerHTML=`<div><span>сожжено сверх покоя</span><b>${fmt(r.kcal)} ккал</b></div><div><span>${r.kmh?'скорость':'MET'}</span><b>${r.kmh?f1(r.kmh)+' км/ч':(r.met?f1(r.met):'—')}</b></div>`}

/* --- вес --- */
SH.w={title:st=>'Вес · '+fDate(st.d),body:st=>`<div class="field" style="margin-top:0"><label for="wv">Килограммы</label><input class="inp num" id="wv" inputmode="decimal" value="${S.weights[st.d]!=null?String(S.weights[st.d]).replace('.',','):''}" placeholder="${weightOn(st.d)?String(r1(weightOn(st.d))).replace('.',','):''}" style="font-size:22px;min-height:54px"></div>
  <div class="field"><label for="wd">Дата</label><input class="inp" type="date" id="wd" value="${st.d}"></div><p class="help">Лучше взвешиваться утром натощак. Смотрите на среднее за неделю, а не на отдельные дни.</p>`,
  foot:st=>`<div class="btns ${S.weights[st.d]!=null?'two':''}" style="margin:0">${S.weights[st.d]!=null?'<button class="btn bad" data-a="wDel">Удалить</button>':''}<button class="btn pri" data-a="wOk">Сохранить</button></div>`,
  after:o=>setTimeout(()=>{try{q(o,'#wv').focus()}catch(e){}},280)};
SH.wlog={title:'Замеры веса',body:()=>{const ks=wKeys().reverse();return ks.length?`<div class="sec list" style="margin-top:0">${ks.map((k,i)=>{const prev=ks[i+1];const d=prev!=null?S.weights[k]-S.weights[prev]:null;return `<button class="row" data-a="wOpen" data-v="${k}"><div class="t"><b>${fDate(k,true)}</b><small>${d==null?'первый замер':(d>0?'+':d<0?'−':'±')+f1(Math.abs(d))+' кг'}</small></div><div class="v">${f1(S.weights[k])} кг</div></button>`}).join('')}</div>`:'<p class="help">Замеров пока нет.</p>'}};

/* --- календарь --- */
SH.cal={title:'Календарь',body:st=>{const [y,m]=st.ym;const first=new Date(y,m,1);const off=(first.getDay()+6)%7;const dim=new Date(y,m+1,0).getDate();const t=today();
  let h=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><button class="ibtn" data-a="calM" data-v="-1" aria-label="Предыдущий месяц">${IC.l}</button><b style="flex:1;text-align:center;font-size:17px">${MONN[m]} ${y}</b><button class="ibtn" data-a="calM" data-v="1" aria-label="Следующий месяц">${IC.r}</button></div><div class="cal">`;
  h+=WDS.map(w=>`<div class="wd">${w}</div>`).join('');for(let i=0;i<off;i++)h+='<div></div>';
  for(let d=1;d<=dim;d++){const s=ds(new Date(y,m,d));let cls='cd',sm='';if(S.voyage&&s>=S.voyage.a&&s<=S.voyage.b)cls+=' v';
    if(hasFood(s)){const k=dayTot(s).k;sm=fmt(k);if(s>t)cls+=' plan';else cls+=k>dayNorm(s)*1.05?' over':' ok'}
    if(s===t)cls+=' today';if(s===V.date)cls+=' sel';
    h+=`<button class="${cls}" data-a="calGo" data-v="${s}"><span>${d}</span><small>${sm||'&nbsp;'}</small></button>`}
  h+=`</div><div class="legend"><span><i style="background:var(--ok)"></i>в норме</span><span><i style="background:var(--bad)"></i>больше нормы</span><span><i style="border:1px dashed var(--accent)"></i>план</span>${S.voyage?'<span><i style="background:var(--soft)"></i>рейс</span>':''}</div>
  <div class="btns two"><button class="btn" data-a="calGo" data-v="${t}">Сегодня</button><button class="btn" data-a="planOpen">Расписать период</button></div>`;return h}};

  ${st.src==='day'?`<div class="field"><label for="ps">Дата-образец</label><input class="inp" type="date" id="ps" value="${st.sd}"></div><p class="help" id="psinfo"></p>`:`<div class="field"><label for="pt">Шаблон</label><select class="inp" id="pt">${S.templates.map(t=>`<option value="${t.id}"${t.id===st.tpl?' selected':''}>${esc(t.n)}</option>`).join('')}</select></div>`}`}

  <div class="lab" style="margin-top:14px">Куда</div>

  ${S.voyage?`<button class="link" style="margin-top:8px" data-a="pVoy">${S.voyage.a>today()?'Весь рейс':'Остаток рейса'}: ${fShort(S.voyage.a>addD(today(),1)?S.voyage.a:addD(today(),1))} — ${fShort(S.voyage.b)}</button>`:''}
  <div class="lab" style="margin-top:12px">Дни недели</div><div class="wdays" style="margin-top:6px">${WDS.map((w,i)=>`<button class="chip${wd[i]?' on':''}" data-a="pWd" data-v="${i}">${w}</button>`).join('')}</div>`}
  <div class="lab" style="margin-top:12px">Если в дне уже есть записи</div><div class="seg" style="margin-top:6px"><button data-a="pMode" data-v="add" class="${st.mode==='add'?'on':''}">Добавить</button><button data-a="pMode" data-v="skip" class="${st.mode==='skip'?'on':''}">Пропустить</button><button data-a="pMode" data-v="rep" class="${st.mode==='rep'?'on':''}">Заменить</button></div>
  <label style="display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px"><input type="checkbox" id="pex" ${st.ex?'checked':''} style="width:20px;height:20px;accent-color:var(--accent)"> Копировать и активность</label>`},
  foot:()=>`<button class="btn pri wide" data-a="pApply">Применить</button>`,
  after:o=>{const i=q(o,'#ps');if(i){const upd=()=>{o.st.sd=i.value;const s=i.value,info=q(o,'#psinfo');if(info)info.textContent=s&&hasFood(s)?`${fDate(s,true)}: ${fmt(dayTot(s).k)} ккал, ${Object.values(S.days[s].m).reduce((a,x)=>a+x.length,0)} записей`:'В этот день нет записей питания.'};i.addEventListener('input',upd);i.addEventListener('change',upd);upd()}}};
function planRead(o){const g=s=>{const e=q(o,s);return e?e.value:null};const st=o.st;st.sd=g('#ps')??st.sd;st.tpl=g('#pt')??st.tpl;st.a=g('#pa')??st.a;st.b=g('#pb')??st.b;const e=q(o,'#pex');if(e)st.ex=e.checked}
function srcDayData(st){if(st.src==='tpl'){const t=S.templates.find(x=>x.id===st.tpl);return t?{m:t.m,ex:t.ex||[]}:null}const d=S.days[st.sd];return d?{m:d.m,ex:d.ex}:null}
function pasteDay(target,src,mode,withEx){const has=!dayEmpty(target);if(has&&mode==='skip')return false;const d=getDay(target,true);
  if(mode==='rep'){d.m={b:[],l:[],d:[],s:[]};if(withEx)d.ex=[]}
  for(const k in src.m)for(const e of src.m[k])d.m[k].push(Object.assign(clone(e),{id:uid()}));
  if(withEx)for(const e of src.ex)d.ex.push(Object.assign(clone(e),{id:uid()}));return true}

/* ========== онлайн-поиск ========== */
async function getJSON(url){if(!navigator.onLine)throw new Error('Нет интернета');const ac=new AbortController();const t=setTimeout(()=>ac.abort(),15000);
  let r;try{r=await fetch(url,{signal:ac.signal})}catch(e){throw new Error(e.name==='AbortError'?'Сервис не ответил за 15 секунд':'Не удалось связаться с сервисом')}finally{clearTimeout(t)}
  if(r.status===429)throw new Error('Лимит запросов исчерпан. Подождите или укажите свой ключ USDA в «Ещё → Онлайн-базы»');
  if(!r.ok)throw new Error('Сервис ответил ошибкой '+r.status);return r.json()}
function usdaX(f){const nut=f.foodNutrients||[];const get=(...ns)=>{for(const n of ns){const x=nut.find(z=>String(z.nutrientNumber)===n&&z.value!=null);if(x)return +x.value}return null};
  let k=get('208');if(k==null)k=get('958','957');if(k==null){const kj=get('268');if(kj!=null)k=kj/4.184}
  return{k:k||0,p:get('203')||0,f:get('204')||0,c:get('205')||0,fb:get('291')||0}}
async function searchUsda(o){const st=o.st;if(!st.q){st.status='Введите название по-английски.';drawResults(o);return}
  st.status='Ищу в USDA…';st.online=[];drawResults(o);
  try{const key=S.settings.usdaKey||'DEMO_KEY';const j=await getJSON(`https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(key)}&query=${encodeURIComponent(st.q)}&dataType=${encodeURIComponent('Foundation,SR Legacy')}&pageSize=30`);
    st.online=(j.foods||[]).map(f=>({id:'usda'+f.fdcId,fdc:f.fdcId,n:f.description,x:usdaX(f),srv:[],src:'usda'})).filter(f=>f.x.k>0||f.x.p>0);
    st.status=st.online.length?`Найдено в USDA: ${st.online.length}. Названия на английском — после добавления его можно переименовать в «Мои продукты».`:'В USDA ничего не нашлось. Попробуйте другое английское слово.'}
  catch(e){st.status=e.message}drawResults(o)}
function offFood(p){const n=p.nutriments||{};let k=n['energy-kcal_100g'];if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;
  const name=p.product_name_ru||p.product_name_ro||p.product_name||p.product_name_en||'Без названия';const srv=[];const sq=+p.serving_quantity;if(sq>0)srv.push(['1 порция'+(p.serving_size?' ('+p.serving_size+')':''),sq]);
  return{id:'off'+p.code,code:p.code,n:name,brand:(p.brands||'').split(',')[0].trim(),x:{k:+k||0,p:+n.proteins_100g||0,f:+n.fat_100g||0,c:+n.carbohydrates_100g||0,fb:+n.fiber_100g||0},srv,src:'off',nodata:k==null}}
const OFF_FIELDS='code,product_name,product_name_ru,product_name_ro,product_name_en,brands,nutriments,serving_quantity,serving_size';
async function searchOff(o){const st=o.st;if(!st.q){st.status='Введите название товара.';drawResults(o);return}
  st.status='Ищу в Open Food Facts…';st.online=[];drawResults(o);
  try{const j=await getJSON(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(st.q)}&search_simple=1&action=process&json=1&page_size=30&fields=${OFF_FIELDS}`);
    st.online=(j.products||[]).map(offFood).filter(f=>!f.nodata);st.status=st.online.length?`Найдено: ${st.online.length}. Проверьте цифры по упаковке.`:'Ничего не нашлось с указанной калорийностью.'}
  catch(e){st.status=e.message}drawResults(o)}
async function lookupCode(o,code){const st=o.st;code=String(code||'').replace(/\D/g,'');if(code.length<6){st.status='Введите штрихкод полностью (обычно 8 или 13 цифр).';drawResults(o);return}
  st.bc=code;const mine=S.foods.find(f=>f.code===code);if(mine){openAmount(Object.assign({src:'my'},mine),{meal:st.meal,date:st.date,mode:st.mode});return}
  st.status='Ищу штрихкод '+code+'…';st.online=[];drawResults(o);
  try{const j=await getJSON(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`);
    if(!j.product||j.status===0){st.status='Товар '+code+' не найден в Open Food Facts. Создайте его вручную через «+ Свой продукт».';drawResults(o);return}

  try{const file=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Рацион — резервная копия'});markBackup();toast('Копия передана. Выберите «Сохранить в Файлы».');return}}
  catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);markBackup();toast('Файл копии сохранён')}

  ukSave:()=>{S.settings.usdaKey=$('#uk').value.trim();save();closeSheet();toast('Сохранено')},
  installOpen:()=>openSheet('install'),
  aboutOpen:()=>openSheet('about'),
  wipeOpen:()=>openSheet('confirm',{t:'Удалить все данные?',msg:'Дневник, вес, продукты, рецепты и настройки будут удалены с этого телефона. Сначала сделайте резервную копию.',ok:'Удалить всё',fn:()=>{S=blank();save();closeAll();V.tab='diary';V.date=today();render()}}),
  oUsda:()=>{const o=topS();o.st.q=q(o,'#aq').value.trim();searchUsda(o)},
  oOff:()=>{const o=topS();o.st.q=q(o,'#aq').value.trim();searchOff(o)},
  oCode:()=>{const o=topS();lookupCode(o,q(o,'#bc').value)},
  scanOpen:()=>{const o=openSheet('scan',{onClose:null});o.st.onClose=()=>{try{o.st.reader&&o.st.reader.reset()}catch(e){}};startScan(o)}
};
function pfRead(o){const p=o.st.p;p.birth=q(o,'#pfb').value;p.h=num(q(o,'#pfh').value)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('input',e=>{if(e.target.id==='aq'){const o=topS();if(o&&o.type==='add'){o.st.q=e.target.value;if(o.st.tab!=='online')drawResults(o)}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aq'){const o=topS();if(o&&o.st.tab==='online'){e.preventDefault();o.st.q=e.target.value.trim();searchUsda(o)}}if(e.key==='Escape'&&V.sheets.length)closeSheet()});
document.addEventListener('change',e=>{if(e.target.id==='g-t'){const v=num(e.target.value);S.goal.target=v>30?v:null;save();render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.profile&&!V.sheets.length){render()}});

render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{})}
</script>
</body>
</html>
